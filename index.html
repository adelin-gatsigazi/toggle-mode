<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
    <div class="light mode">
        <img id="img-light" 
        src="images/Light-mode sun.gif" 
        alt="light-mode">
        <p id="text-light">Light Mode</p>
        <label class="switch light">
            <input type="checkbox">
            <span class="slider round light"></span>
        </label>
    </div>
    <div class="dark-mode">
        <img id="img-dark" 
        src="images/dark-mode moon.gif" 
        alt="dark-mode">
        <p id="text-dark">Dark Mode</p>
        <label class="switch dark">
            <input type="checkbox" checked>
            <span class="slider round dark"></span>
        </label>
    </div>
</body>
<script src="script.js"></script>
</html>
